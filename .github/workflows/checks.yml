name: Check and publish tracker
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ftp_protocol:
        description: FTP connection protocol
        type: choice
        options: [ftps, ftp]
        default: ftps
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm test
      - run: python test_app.py
      - run: python scripts/test_ftp_target.py
      - run: python scripts/test_verify_site.py
      - run: npm run build
      - run: npm run build:sheets
      - name: Check published assets match source
        run: git diff --exit-code -- htdocs
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: htdocs
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
  deploy-ftp:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ftp-production
      url: https://cleaninglondon.online/
    concurrency:
      group: ftp-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Find the existing website document root
        id: target
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ inputs.ftp_protocol || vars.FTP_PROTOCOL || 'ftps' }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          FTP_WEBSITE_URL: https://cleaninglondon.online/
        run: python scripts/ftp-target.py
      - name: Upload the tested website
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ steps.target.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ steps.target.outputs.port }}
          protocol: ${{ steps.target.outputs.protocol }}
          security: strict
          local-dir: ./htdocs/
          server-dir: ${{ steps.target.outputs.server_dir }}
          state-name: .hybrid-workout-tracker-ftp-state.json
          dangerous-clean-slate: false
      - name: Verify the live website
        env:
          WEBSITE_URL: https://cleaninglondon.online/
          RELEASE_SHA: ${{ github.sha }}
        run: python scripts/verify-site.py
