<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
  /* Layout: full-bleed cinematic bands on pure black, content on a 1280px rail. */
  :root {
    color-scheme: dark;
    --bg: #000000;
    --fg: #ffffff;
    --amber: #ffb733;
    --cream: #e8ddc4;
    --ink: #f0f0ee;
    --slate: #2b3342;
  }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
  ::selection { background: rgba(255, 183, 51, .35); color: var(--fg); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

  /* Logo strip */
  @keyframes marquee { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-50%, 0, 0); } }
  .edge-fade {
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
  }

  /* Hero atmosphere */
  @keyframes twinkle { 0%, 100% { opacity: var(--o); } 50% { opacity: calc(var(--o) * .25); } }
  .star { position: absolute; border-radius: 50%; background: var(--cream); opacity: var(--o); pointer-events: none; animation: twinkle 4.5s ease-in-out infinite; }
  .glow {
    background: radial-gradient(ellipse at center, rgba(120, 128, 170, .35) 0%, transparent 65%);
    background: radial-gradient(ellipse at center, oklch(0.55 0.05 265 / 0.35) 0%, transparent 65%);
  }

  /* Mockup details */
  @keyframes eq { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
  .eq > i { display: block; width: 2px; border-radius: 2px; background: currentColor; animation: eq 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .caret { display: inline-block; width: 1.5px; height: 1.1em; vertical-align: -0.2em; background: var(--amber); animation: blink 1s steps(1) infinite; }

  /* Reveal band: clean portrait, gold at 10%, a cursor-led oval of full gold, scrim */
  .reveal { height: 100vh; height: 100svh; min-height: 600px; background: var(--slate); color: var(--ink); }
  .rv-img {
    position: absolute; inset: 0; width: 100%; height: 100%; max-width: none;
    object-fit: cover; object-position: center; transform: translateZ(0);
    user-select: none; -webkit-user-select: none; -webkit-user-drag: none; pointer-events: none;
  }
  .rv-gold { opacity: .1; }
  .rv-spot {
    opacity: 0; transition: opacity .4s ease-out; will-change: opacity;
    -webkit-mask-image: radial-gradient(closest-side, #000 62%, transparent 100%);
    mask-image: radial-gradient(closest-side, #000 62%, transparent 100%);
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-size: var(--ow, 110px) var(--oh, 140px); mask-size: var(--ow, 110px) var(--oh, 140px);
    -webkit-mask-position: -999px -999px; mask-position: -999px -999px;
  }
  .rv-spot.is-on { opacity: 1; }
  .rv-scrim { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(20, 24, 32, .55) 0%, rgba(20, 24, 32, .12) 45%, rgba(20, 24, 32, .6) 100%); }
  .rv-seam { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, var(--bg) 0%, transparent 14%, transparent 86%, var(--bg) 100%); }
  .rv-content { position: relative; z-index: 3; height: 100%; display: flex; flex-direction: column; pointer-events: none; padding: 28px 20px; font-weight: 500; }
  @media (min-width: 768px) { .rv-content { padding: 44px 64px 40px; } }
  .rv-title { font-size: clamp(40px, 7.4vw, 104px); font-weight: 500; letter-spacing: -0.02em; line-height: .98; }
  .rv-plus { width: .8em; height: .8em; flex-shrink: 0; display: inline-grid; place-items: center; border: 1.5px solid var(--ink); border-radius: 50%; }
  .rv-plus > span { font-size: .45em; font-weight: 400; line-height: 1; }
  .rv-copy { font-size: 15.5px; line-height: 1.6; word-spacing: .15em; }
  @media (min-width: 768px) { .rv-copy { text-align: justify; } }

  /* Shown until React mounts */
  .boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); color: var(--fg); }
  .boot svg { width: 40px; height: 40px; animation: boot 1.4s ease-in-out infinite; }
  @keyframes boot { 50% { opacity: .35; transform: scale(.94); } }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0ms !important; }
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useId } = React;

/* ---------- Media ---------- */
// Each video tries the local copy first and falls back to the CDN original.
const CDN = 'https://cdn.sceneai.art/Hero%20Section%20Video/';
const VIDEO = {
  hero: ['media/hero.mp4', CDN + '50b4f304-cdca-4e12-8735-580d225834be.mp4'],
  chat: ['media/chat.mp4', CDN + '1bcc8fa3-37f6-4c53-8591-0347e4c7f8ac.mp4'],
  transcribe: ['media/transcribe.mp4', CDN + '736fd4a0-70ac-4f44-9633-55769ead6aca.mp4'],
};
// Both portraits are cropped to the same frame so the gold layer lines up with the clean one.
const PORTRAIT = { clean: 'media/portrait-clean.jpg', gold: 'media/portrait-gold.jpg' };

/* ---------- Helpers ---------- */
const prefersReducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function scrollToId(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'start' });
}

function useInView(ref, { threshold = 0, rootMargin = '0px', once = false } = {}) {
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el || !('IntersectionObserver' in window)) { setInView(true); return; }
    const io = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) {
        setInView(true);
        if (once) io.disconnect();
      } else if (!once) {
        setInView(false);
      }
    }, { threshold, rootMargin });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return inView;
}

function FadeInUp({ children, delay = 0, className = '' }) {
  const ref = useRef(null);
  const shown = useInView(ref, { threshold: 0.15, rootMargin: '0px 0px -40px 0px', once: true });
  return (
    <div
      ref={ref}
      style={{ transitionDelay: `${delay}ms` }}
      className={`transition-all duration-1000 ease-[cubic-bezier(0.16,1,0.3,1)] ${shown ? 'translate-y-0 opacity-100' : 'translate-y-10 opacity-0'} ${className}`}
    >
      {children}
    </div>
  );
}

// Muted, inline, looping background video. Plays while on screen, resumes if the browser pauses it.
function BgVideo({ srcs, className = '', eager = false }) {
  const ref = useRef(null);
  const [ready, setReady] = useState(false);
  const [reduce] = useState(prefersReducedMotion);

  useEffect(() => {
    const v = ref.current;
    if (!v) return;
    v.muted = true;
    v.defaultMuted = true;
    if (reduce) return;
    let visible = false;
    const play = () => { if (visible && !document.hidden) v.play().catch(() => {}); };
    const onPause = () => { if (visible && !document.hidden) setTimeout(play, 150); };
    const onVisibility = () => (document.hidden ? v.pause() : play());
    const io = new IntersectionObserver(([entry]) => {
      visible = entry.isIntersecting;
      visible ? play() : v.pause();
    }, { rootMargin: '200px 0px' });
    io.observe(v);
    v.addEventListener('pause', onPause);
    document.addEventListener('visibilitychange', onVisibility);
    return () => {
      io.disconnect();
      v.removeEventListener('pause', onPause);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, []);

  return (
    <video
      ref={ref}
      muted
      loop
      playsInline
      autoPlay={eager && !reduce}
      preload={eager || reduce ? 'auto' : 'metadata'}
      aria-hidden="true"
      onLoadedData={() => setReady(true)}
      className={`${className} transition-opacity duration-1000 ${ready ? '' : '!opacity-0'}`}
    >
      {srcs.map((src) => <source key={src} src={src} type="video/mp4" />)}
    </video>
  );
}

function SectionLink({ to, onNavigate, children, ...rest }) {
  return (
    <a
      href={`#${to}`}
      onClick={(e) => { e.preventDefault(); onNavigate?.(); scrollToId(to); }}
      {...rest}
    >
      {children}
    </a>
  );
}

/* ---------- Icons ---------- */
const Svg = ({ className = 'h-4 w-4', sw = 1.75, children }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
    {children}
  </svg>
);
const ArrowRight = (p) => <Svg {...p} sw={2}><path d="M4 12h15" /><path d="M13.5 5.5 20 12l-6.5 6.5" /></Svg>;
const PlusIcon = (p) => <Svg {...p}><path d="M12 5v14M5 12h14" /></Svg>;
const MicIcon = (p) => <Svg {...p}><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" /></Svg>;
const ImageIcon = (p) => <Svg {...p}><rect x="3.5" y="4.5" width="17" height="15" rx="3" /><circle cx="9" cy="10" r="1.6" /><path d="m20.5 15.5-4.5-4.5-8.5 8.5" /></Svg>;
const DocIcon = (p) => <Svg {...p}><path d="M6 3.5h8l4 4v13H6z" /><path d="M14 3.5V8h4M9 12.5h6M9 16h4" /></Svg>;
const ChartIcon = (p) => <Svg {...p}><path d="M4 4v16h16" /><path d="m8 15 3.5-4 3 2.5L19 8" /></Svg>;
const CodeIcon = (p) => <Svg {...p}><path d="m8.5 8-4 4 4 4M15.5 8l4 4-4 4M13.5 5.5l-3 13" /></Svg>;
const PlayIcon = ({ className }) => (
  <svg viewBox="0 0 24 24" className={className} aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor" /></svg>
);
const PauseIcon = ({ className }) => (
  <svg viewBox="0 0 24 24" className={className} aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2" fill="currentColor" /><rect x="13.5" y="5" width="4" height="14" rx="1.2" fill="currentColor" /></svg>
);

// Plety mark: a stroked "P" whose bowl holds an amber lens, inside a softly graded tile.
function Logo({ className = 'h-8 w-8' }) {
  const gid = 'plety' + useId().replace(/[^a-zA-Z0-9]/g, '');
  return (
    <svg viewBox="0 0 32 32" fill="none" className={className} aria-hidden="true">
      <defs>
        <linearGradient id={gid} x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
          <stop stopColor="#fff" stopOpacity=".85" />
          <stop offset="1" stopColor="#fff" stopOpacity=".12" />
        </linearGradient>
      </defs>
      <rect x="1.25" y="1.25" width="29.5" height="29.5" rx="9.5" stroke={`url(#${gid})`} strokeWidth="1.5" />
      <path d="M11.75 23.5V8.75h5.5a5.25 5.25 0 0 1 0 10.5h-5.5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx="17.25" cy="14" r="1.6" fill="#FFB733" />
    </svg>
  );
}

function Ornament({ className = '' }) {
  return (
    <div className={`flex items-center justify-center gap-4 ${className}`} aria-hidden="true">
      <span className="h-px w-12 bg-gradient-to-r from-transparent to-[#FFB733]" />
      <span className="text-[18px] leading-none text-[#FFB733]">✦</span>
      <span className="h-px w-12 bg-gradient-to-r from-[#FFB733] to-transparent" />
    </div>
  );
}

/* ---------- Buttons ---------- */
function PrimaryButton({ to = 'contact', children }) {
  return (
    <SectionLink to={to} className="group inline-flex items-center gap-2.5 rounded-full bg-white px-6 py-3 text-sm font-medium text-black transition-transform duration-200 hover:-translate-y-px">
      {children}
      <ArrowRight className="h-4 w-4 transition-transform duration-300 group-hover:translate-x-0.5" />
    </SectionLink>
  );
}

function SecondaryButton({ to = 'features', children }) {
  return (
    <SectionLink to={to} className="inline-flex items-center rounded-full border border-white/5 bg-[#1F1F22] px-6 py-3 text-sm font-medium text-white transition-colors duration-200 hover:bg-[#2A2A2D]">
      {children}
    </SectionLink>
  );
}

/* ---------- Navigation ---------- */
const NAV = [['About', 'about'], ['Features', 'features'], ['FAQ', 'faq'], ['Contact', 'contact']];

function Navbar() {
  const [scrolled, setScrolled] = useState(false);
  const [open, setOpen] = useState(false);
  const close = () => setOpen(false);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 20);
    const onResize = () => { if (window.innerWidth >= 768) setOpen(false); };
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onResize);
    window.addEventListener('keydown', onKey);
    return () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onResize);
      window.removeEventListener('keydown', onKey);
    };
  }, []);

  return (
    <header
      className={`fixed inset-x-0 top-0 z-50 border-b transition-[background-color,border-color] duration-300 ${scrolled || open ? 'border-white/5 bg-black/80 backdrop-blur-md' : 'border-transparent bg-transparent'}`}
      style={{ paddingTop: 'env(safe-area-inset-top, 0px)' }}
    >
      <nav aria-label="Primary" className="mx-auto flex h-16 max-w-7xl items-center justify-between px-6 md:grid md:h-[72px] md:grid-cols-[1fr_auto_1fr]">
        <SectionLink to="about" onNavigate={close} aria-label="Plety home" className="flex items-center gap-2.5 justify-self-start text-white">
          <Logo className="h-8 w-8" />
          <span className="text-lg font-semibold tracking-tight">Plety</span>
        </SectionLink>

        <ul className="hidden items-center gap-8 md:flex">
          {NAV.map(([label, id]) => (
            <li key={id}>
              <SectionLink to={id} className="text-sm font-medium text-gray-300 transition-colors hover:text-white">{label}</SectionLink>
            </li>
          ))}
        </ul>

        <div className="hidden justify-self-end md:block">
          <SectionLink to="contact" className="rounded-full border border-white/5 bg-[#1F1F22] px-5 py-2.5 text-sm font-medium text-white transition-colors hover:bg-[#2A2A2D]">
            Get started
          </SectionLink>
        </div>

        <button
          type="button"
          onClick={() => setOpen((o) => !o)}
          aria-expanded={open}
          aria-controls="mobile-menu"
          aria-label={open ? 'Close menu' : 'Open menu'}
          className="relative -mr-2 grid h-10 w-10 place-items-center rounded-full text-white md:hidden"
        >
          <span className={`absolute h-[1.5px] w-5 bg-current transition-transform duration-300 ${open ? 'rotate-45' : '-translate-y-[4px]'}`} />
          <span className={`absolute h-[1.5px] w-5 bg-current transition-transform duration-300 ${open ? '-rotate-45' : 'translate-y-[4px]'}`} />
        </button>
      </nav>

      <div
        id="mobile-menu"
        aria-hidden={!open}
        className={`grid transition-[grid-template-rows] duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] md:hidden ${open ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'}`}
      >
        <div className="min-h-0 overflow-hidden">
          <ul className={`flex flex-col px-6 pb-6 pt-1 transition-opacity duration-300 ${open ? 'opacity-100' : 'opacity-0'}`}>
            {NAV.map(([label, id]) => (
              <li key={id}>
                <SectionLink to={id} onNavigate={close} tabIndex={open ? 0 : -1} className="block border-b border-white/5 py-4 text-base font-medium text-gray-300 transition-colors hover:text-white">
                  {label}
                </SectionLink>
              </li>
            ))}
            <li className="pt-5">
              <SectionLink to="contact" onNavigate={close} tabIndex={open ? 0 : -1} className="flex w-full items-center justify-center rounded-full bg-white py-3 text-sm font-medium text-black">
                Get started
              </SectionLink>
            </li>
          </ul>
        </div>
      </div>
    </header>
  );
}

/* ---------- Hero ---------- */
const STARS = [
  { top: '14%', left: '14%', s: 3, o: 0.5, glow: '0 0 6px 1px oklch(0.85 0.08 85 / 0.5)' },
  { top: '28%', right: '18%', s: 2, o: 0.4, glow: '0 0 5px 1px oklch(0.85 0.08 85 / 0.4)' },
  { top: '49%', left: '10%', s: 2, o: 0.35 },
  { top: '60%', right: '12%', s: 3, o: 0.3, glow: '0 0 6px 1px oklch(0.85 0.08 85 / 0.35)' },
  { top: '21%', left: '33%', s: 2, o: 0.3 },
  { top: '40%', right: '33%', s: 2, o: 0.45 },
];

const BRANDS = [
  { name: 'Springfield', type: 'font-serif text-xl italic', icon: <><path d="M12 20.5V11" /><path d="M12 11c0-4-3-6.5-7.5-6.5 0 4.5 3 7 7.5 6.5z" /><path d="M12 13.5c0-3.2 2.4-5.5 6.5-5.5 0 4-2.6 6-6.5 5.5z" /></> },
  { name: 'Orbitc', type: 'text-lg font-semibold lowercase tracking-tight', icon: <><circle cx="12" cy="12" r="3" /><ellipse cx="12" cy="12" rx="9.5" ry="4.25" transform="rotate(-28 12 12)" /></> },
  { name: 'Cloud', type: 'text-lg font-medium tracking-tight', icon: <path d="M7.25 18.5h10a4 4 0 0 0 .6-7.96 6 6 0 0 0-11.45 1.1A3.5 3.5 0 0 0 7.25 18.5z" /> },
  { name: 'Amster', type: 'font-mono text-sm font-medium uppercase tracking-[0.2em]', icon: <><path d="M12 3.5 3.5 20h17z" /><path d="M8 14.5h8" /></> },
  { name: 'Nexus', type: 'text-lg font-bold tracking-tight', icon: <><path d="M12 2.75 20 7.4v9.2l-8 4.65-8-4.65V7.4z" /><circle cx="12" cy="12" r="2.25" /><path d="M12 2.75v7M20 16.6l-6.05-3.5M4 16.6l6.05-3.5" /></> },
];

function Marquee() {
  // Four identical sets: sliding by -50% lands exactly on set three, so the loop never jumps.
  const loop = [0, 1, 2, 3].flatMap((copy) => BRANDS.map((b) => ({ ...b, copy })));
  return (
    <div className="mx-auto mt-24 w-full max-w-6xl px-6">
      <p className="mb-8 text-center text-sm font-medium text-gray-500">Trusted by industry leaders</p>
      <div className="edge-fade overflow-hidden">
        <ul className="flex w-max animate-[marquee_30s_linear_infinite] hover:[animation-play-state:paused]">
          {loop.map((b) => (
            <li
              key={b.name + b.copy}
              aria-hidden={b.copy > 0 ? 'true' : undefined}
              className="flex flex-shrink-0 items-center gap-2.5 px-8 text-gray-400 transition-colors duration-300 hover:text-white"
            >
              <Svg className="h-6 w-6" sw={1.6}>{b.icon}</Svg>
              <span className={b.type}>{b.name}</span>
            </li>
          ))}
        </ul>
      </div>
    </div>
  );
}

function Hero({ onBadge }) {
  return (
    <section id="about" className="relative z-0 flex min-h-screen flex-col items-center justify-center overflow-hidden pb-20 pt-32">
      <BgVideo srcs={VIDEO.hero} eager className="absolute inset-0 -z-10 h-full min-h-full w-full min-w-full object-cover opacity-90" />
      <div className="absolute inset-0 -z-10 bg-gradient-to-b from-black/30 via-transparent to-black" />
      {STARS.map((st, i) => (
        <span
          key={i}
          aria-hidden="true"
          className="star"
          style={{ top: st.top, left: st.left, right: st.right, width: st.s, height: st.s, '--o': st.o, boxShadow: st.glow, animationDelay: `${i * 0.7}s` }}
        />
      ))}

      <div className="flex w-full flex-col items-center px-6">

function useTypewriter(list, active) {
  const [s, setS] = useState({ i: 0, n: 0, del: false });
  useEffect(() => {
    if (!active) return;
    const full = list[s.i].text;
    let wait = s.del ? 24 : 48;
    if (!s.del && s.n === full.length) wait = 1900;
    if (s.del && s.n === 0) wait = 380;
    const t = setTimeout(() => {
      setS((p) => {
        const len = list[p.i].text.length;
        if (!p.del && p.n < len) return { ...p, n: p.n + 1 };
        if (!p.del) return { ...p, del: true };
        if (p.n > 0) return { ...p, n: p.n - 1 };
        return { i: (p.i + 1) % list.length, n: 0, del: false };
      });
    }, wait);
    return () => clearTimeout(t);
  }, [s, active]);
  return { index: s.i, text: list[s.i].text.slice(0, s.n) };
}

function TranscriptCard() {
  const ref = useRef(null);
  const visible = useInView(ref, { threshold: 0.4 });
  const [reduce] = useState(prefersReducedMotion);
  const [progress, setProgress] = useState(reduce ? 0.42 : 0);
  const [playing, setPlaying] = useState(false);
  const pausedByUser = useRef(false);
  const progressRef = useRef(progress);

  useEffect(() => {
    if (!reduce && !pausedByUser.current) setPlaying(visible);
  }, [visible]);

  useEffect(() => {
    if (!playing) return;
    let raf = 0;
    let last = performance.now();
    let hold = 0;
    const step = (now) => {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      let p = progressRef.current;
      if (p >= 1) {
        hold += dt;
        if (hold > 1.6) { hold = 0; p = 0; }
      } else {
        p = Math.min(1, p + dt / 9);
      }
      progressRef.current = p;
      setProgress(p);
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [playing]);

  const toggle = () => {
    pausedByUser.current = playing;
    setPlaying(!playing);
  };

  const spoken = Math.floor(progress * TRANSCRIPT.length);
  const seconds = Math.round(progress * CLIP_SECONDS);

  return (
    <div ref={ref} className="w-full max-w-md rounded-2xl border border-white/10 bg-[#1C1C1E]/90 p-5 shadow-2xl shadow-black/50 backdrop-blur-xl">
      <div className="flex items-center gap-3">
        <button
          type="button"
          onClick={toggle}
          aria-label={playing ? 'Pause recording' : 'Play recording'}
          className="grid h-10 w-10 flex-shrink-0 place-items-center rounded-full bg-white text-black transition-transform duration-200 hover:scale-105"
        >
          {playing ? <PauseIcon className="h-4 w-4" /> : <PlayIcon className="h-4 w-4 translate-x-px" />}
        </button>
        <div className="min-w-0 flex-1">
          <p className="truncate text-sm font-medium text-white">11:06 AM · Chris</p>
          <p className="truncate text-xs text-gray-500">Weekly product sync</p>
        </div>
        <span className="font-mono text-xs tabular-nums text-gray-400">
          0:{String(seconds).padStart(2, '0')} / 0:{CLIP_SECONDS}
        </span>
      </div>

      <div className="mt-5 flex h-12 items-center gap-[2px]" aria-hidden="true">
        {BARS.map((h, i) => (
          <span
            key={i}
            className={`flex-1 rounded-full transition-colors duration-150 ${i / BARS.length < progress ? 'bg-emerald-400' : 'bg-white/15'}`}
            style={{ height: `${h}%` }}
          />
        ))}
      </div>

      <div className="mt-5 border-t border-white/10 pt-4">
        <div className="mb-2 flex items-center gap-2 text-xs text-gray-500">
          <span className={`h-1.5 w-1.5 rounded-full bg-emerald-400 ${playing ? 'animate-pulse' : ''}`} />
          Live transcript
        </div>
        <p className="text-sm leading-relaxed">
          {TRANSCRIPT.map((w, i) => (
            <span key={i} className={`transition-colors duration-300 ${i < spoken ? 'text-gray-100' : 'text-gray-500'}`}>{w} </span>
          ))}
        </p>
      </div>
    </div>
  );
}

/* ---------- Reveal band ---------- */
function RevealBand() {
  const secRef = useRef(null);
  const spotRef = useRef(null);
  const [touch, setTouch] = useState(false);

  useEffect(() => {
    const sec = secRef.current;
    const spot = spotRef.current;
    const fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    const reduce = prefersReducedMotion();
    setTouch(!fine);

    let ow = 110, oh = 140;
    let tx = 0, ty = 0, cx = 0, cy = 0;
    let raf = 0;

    const sizeOval = () => {
      ow = Math.max(110, Math.round(sec.clientHeight * 0.16));
      oh = Math.round((ow * 140) / 110);
      spot.style.setProperty('--ow', `${ow}px`);
      spot.style.setProperty('--oh', `${oh}px`);
    };
    const paint = () => {
      const pos = `${cx - ow / 2}px ${cy - oh / 2}px`;
      spot.style.webkitMaskPosition = pos;
      spot.style.maskPosition = pos;
    };
    const local = (e) => {
      const r = sec.getBoundingClientRect();
      return [e.clientX - r.left, e.clientY - r.top];
    };
    sizeOval();
    window.addEventListener('resize', sizeOval);

    if (fine) {
      // Desktop: one rAF loop lerps toward the cursor and stops once it settles.
      let armed = false;
      const glide = () => {
        cx += (tx - cx) * 0.22;
        cy += (ty - cy) * 0.22;
        if (Math.abs(tx - cx) < 0.3 && Math.abs(ty - cy) < 0.3) {
          cx = tx; cy = ty; paint(); raf = 0;
          return;
        }
        paint();
        raf = requestAnimationFrame(glide);
      };
      const onMove = (e) => {
        [tx, ty] = local(e);
        if (!armed) {
          armed = true;
          cx = tx; cy = ty; paint();
          spot.classList.add('is-on');
        }
        if (!raf) raf = requestAnimationFrame(glide);
      };
      const onLeave = () => {
        armed = false;
        spot.classList.remove('is-on');
      };
      sec.addEventListener('mousemove', onMove);
      sec.addEventListener('mouseleave', onLeave);
      return () => {
        cancelAnimationFrame(raf);
        window.removeEventListener('resize', sizeOval);
        sec.removeEventListener('mousemove', onMove);
        sec.removeEventListener('mouseleave', onLeave);
      };
    }

    // Touch: the oval drifts across the face while the band is on screen; a touch steers it for 3s.
    let userUntil = 0;
    let hideTimer = 0;
    const t0 = performance.now();
    const drift = (now) => {
      const iw = spot.naturalWidth || 2560;
      const ih = spot.naturalHeight || 1560;
      const w = sec.clientWidth;
      const h = sec.clientHeight;
      const s = Math.max(w / iw, h / ih);
      const fx = (w - iw * s) / 2 + iw * s * 0.49;
      const fy = (h - ih * s) / 2 + ih * s * 0.47;
      const t = (now - t0) / 1000;
      return [fx + Math.min(w * 0.3, 260) * Math.sin(t * 0.55), fy + h * 0.14 * Math.sin(t * 0.9 + 0.8)];
    };
    const wander = (now) => {
      if (now > userUntil) [tx, ty] = drift(now);
      cx += (tx - cx) * 0.22;
      cy += (ty - cy) * 0.22;
      paint();
      raf = requestAnimationFrame(wander);
    };
    const onPointer = (e) => {
      if (e.pointerType === 'mouse') return;
      [tx, ty] = local(e);
      userUntil = performance.now() + 3000;
      if (reduce) {
        cx = tx; cy = ty; paint();
        spot.classList.add('is-on');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => spot.classList.remove('is-on'), 2500);
      }
    };
    const io = new IntersectionObserver(([entry]) => {
      if (reduce) return;
      if (entry.isIntersecting) {
        [cx, cy] = [tx, ty] = drift(performance.now());
        paint();
        spot.classList.add('is-on');
        if (!raf) raf = requestAnimationFrame(wander);
      } else {
        spot.classList.remove('is-on');
        cancelAnimationFrame(raf);
        raf = 0;
      }
    }, { threshold: 0.3 });
    io.observe(sec);
    sec.addEventListener('pointerdown', onPointer, { passive: true });
    sec.addEventListener('pointermove', onPointer, { passive: true });
    return () => {
      io.disconnect();
      cancelAnimationFrame(raf);
      clearTimeout(hideTimer);
      window.removeEventListener('resize', sizeOval);
      sec.removeEventListener('pointerdown', onPointer);
      sec.removeEventListener('pointermove', onPointer);
    };
  }, []);

  return (
    <section ref={secRef} id="insight" aria-labelledby="insight-title" className="reveal relative overflow-hidden">
      <img src={PORTRAIT.clean} alt="" draggable="false" className="rv-img" />
      <img src={PORTRAIT.gold} alt="" draggable="false" className="rv-img rv-gold" />
      <img ref={spotRef} src={PORTRAIT.gold} alt="" draggable="false" className="rv-img rv-spot" />
      <div className="rv-scrim" />
      <div className="rv-seam" />

      <div className="rv-content">
        <div className="flex items-baseline justify-between gap-4 text-[15px] tracking-[0.02em] md:text-[16px]">
          <div className="flex gap-7">
            <span>plety®</span>
            <span className="hidden sm:inline">signal lab</span>
          </div>
          <span className="rounded-full border-[1.5px] border-[#f0f0ee] px-5 py-1 text-[15px]">©2026</span>
          <div className="hidden gap-3.5 md:flex">
            <span>(</span><span>raw data</span><span>/</span><span>clear signal</span><span>)</span>
          </div>
        </div>

        <h2 id="insight-title" className="rv-title mt-10 lowercase">
          <span className="block">see beneath</span>
          <span className="inline-flex items-center gap-4 md:gap-6">
            <span className="rv-plus" aria-hidden="true"><span>+</span></span>
            the surface
          </span>
        </h2>

        <div className="mt-auto flex flex-col items-start gap-6 md:flex-row md:items-end md:justify-between md:gap-12">
          <p className="text-[18px] leading-[1.45]">
            {touch ? 'touch to see' : 'hover to see'}<br />what the data hides
          </p>
          <div className="w-full max-w-[560px]">
            <p className="rv-copy">
              every dataset wears a mask. plety looks past it to find the anomaly before it turns into an incident and the pattern before it shows up in a quarterly report. move across the frame and the signal surfaces where the noise used to be.
            </p>
            <div className="mt-5 flex justify-between text-[14px] tracking-[0.02em]">
              <span>decision layer · vol.02</span>
              <span>( scroll ↓ )</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

      </div>

      <div className="mx-auto mb-24 grid max-w-7xl grid-cols-2 gap-8 md:grid-cols-4">
        <div className="col-span-2 md:col-span-1">
          <div className="flex items-center gap-2.5">
            <Logo className="h-8 w-8" />
            <span className="text-xl font-bold tracking-tight">Plety</span>
          </div>
          <p className="mt-4 max-w-xs text-sm text-gray-400">Speed, scale, and smarts. Deployed.</p>
        </div>
        {FOOTER_COLUMNS.map((col) => (
          <nav key={col.title} aria-label={col.title}>
            <h3 className="mb-4 text-sm font-medium text-white">{col.title}</h3>
            <ul className="flex flex-col gap-3">
              {col.links.map(([label, href]) => (
                <li key={label}><FooterLink href={href}>{label}</FooterLink></li>
              ))}
            </ul>
          </nav>
        ))}
      </div>

      <div className="mx-auto flex max-w-7xl flex-col items-center justify-center gap-4 border-t border-white/5 pt-8 text-xs text-gray-500 md:flex-row">
        <span>© 2026 Plety. All rights reserved</span>
        <span className="hidden h-1 w-1 rounded-full bg-gray-600 md:block" aria-hidden="true" />
        <span>by <span className="text-gray-300">Re-text</span></span>
        <span className="hidden h-1 w-1 rounded-full bg-gray-600 md:block" aria-hidden="true" />
        <span>Made in <span className="text-gray-300">Gemini</span></span>
      </div>
    </footer>
  );
}

function App() {
  const [faqOpen, setFaqOpen] = useState(-1);
  const showApiNews = () => { setFaqOpen(2); scrollToId('faq'); };
  return (
    <>
      <Navbar />
      <main>
        <Hero onBadge={showApiNews} />
        <FeatureChat />
        <FeatureTranscribe />
        <RevealBand />
        <Faq open={faqOpen} setOpen={setFaqOpen} />
      </main>
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
